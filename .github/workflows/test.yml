name: Test Formulae

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - macos-15-intel
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler gems
        uses: actions/cache@main
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean runner
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Collect all formulae
        id: all-formulae
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          tap="${GITHUB_REPOSITORY/homebrew-/}"
          tap_path="${{ steps.set-up-homebrew.outputs.repository-path }}"
          paths=("$tap_path"/Formula/*.rb)

          if (( ${#paths[@]} == 0 )); then
            echo "No formulae found in $tap_path/Formula/"
            exit 1
          fi

          formulae=()
          for path in "${paths[@]}"; do
            formula="${path##*/}"
            formulae+=("$tap/${formula%.rb}")
          done

          joined=$(IFS=,; echo "${formulae[*]}")
          echo "formulae=${joined}" >> "$GITHUB_OUTPUT"

      - name: Test all formulae
        if: github.event_name != 'pull_request'
        run: >-
          brew test-bot --only-formulae
          --testing-formulae="${{ steps.all-formulae.outputs.formulae }}"
